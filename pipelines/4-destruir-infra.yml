name: Limpieza - Destruir Infraestructura
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destruir:
    name: terraform destroy
    runs-on: ubuntu-latest
    environment: produccion-infra
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Destruir recursos (apaga ECS Fargate)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -reconfigure \
            -backend-config="bucket=devops-final-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=triple-pipeline/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform destroy -var="aws_region=${{ vars.AWS_REGION }}" -auto-approve
