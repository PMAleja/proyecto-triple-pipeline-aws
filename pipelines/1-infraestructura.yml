name: Pipeline 1 - Infraestructura Terraform
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validar-y-planificar:
    name: 1-3. Repo IaC, Validacion/Lint y Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: 1. Checkout Repositorio IaC
        uses: actions/checkout@v4

      - name: Configurar AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 2. Validacion y Lint (fmt + validate)
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive || true
          terraform validate

      - name: Preparar bucket S3 para el estado de Terraform
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION }}"
          BUCKET="devops-final-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi
          echo "TF_BUCKET=$BUCKET" >> $GITHUB_ENV

      - name: 3. Generar Plan de Infraestructura
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=triple-pipeline/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform plan -var="aws_region=${{ secrets.AWS_REGION }}" -out=tfplan

      - name: Guardar artefacto tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          include-hidden-files: true
          path: |
            terraform/tfplan
            terraform/.terraform.lock.hcl

  aprobar-y-aplicar:
    name: 4-6. Aprobacion Manual y Apply
    needs: validar-y-planificar
    runs-on: ubuntu-latest
    environment: produccion-infra # Pausa el pipeline hasta que apruebes manualmente
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: 5. Apply / Provisionamiento en AWS
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -reconfigure \
            -backend-config="bucket=devops-final-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=triple-pipeline/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform apply -auto-approve tfplan
          terraform output
          echo "6. Infraestructura lista en AWS"
